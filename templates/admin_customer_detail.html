<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin | Edit Customer</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    background:#f1f5f9;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:600px;
    margin:0 auto;
}

.card{
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.card h2{
    color:#333;
    margin-bottom:25px;
    font-size:24px;
    display:flex;
    align-items:center;
    gap:10px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#333;
    font-weight:600;
    font-size:14px;
}

input, textarea, select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
}

input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

textarea{
    resize:vertical;
    min-height:80px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
    flex-wrap:wrap;
}

.btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:0.3s;
    font-size:15px;
}

.btn-save{
    background:#22c55e;
    color:#fff;
}

.btn-save:hover{
    background:#16a34a;
}

.btn-back{
    background:#6b7280;
    color:#fff;
}

.btn-back:hover{
    background:#4b5563;
}

.info-box{
    background:#f0f9ff;
    border-left:4px solid #0ea5e9;
    padding:15px;
    border-radius:6px;
    margin-bottom:20px;
    font-size:14px;
    color:#0c4a6e;
}

.info-box strong{
    display:block;
    margin-bottom:5px;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h2 style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <span><i class="fa fa-edit"></i> Edit Customer Details</span>
            <span style="font-size:14px">
                <a href="/admin/settings" style="color:#2563eb;text-decoration:none">⚙️ Settings</a>
            </span>
        </h2>

        <div class="info-box">
            <strong>Order ID:</strong> {{ customer.id }}
        </div>

        {% if success %}
        <div class="info-box" style="background:#ecfdf5; border-left-color:#10b981; color:#065f46;">
            <i class="fa fa-check-circle"></i> {{ success }}
        </div>
        {% endif %}

        {% if error %}
        <div class="info-box" style="background:#fff1f2; border-left-color:#ef4444; color:#7f1d1d;">
            <i class="fa fa-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" name="name" value="{{ customer.name }}" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" name="mobile" value="{{ customer.mobile }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ customer.email }}">
                </div>
                <div class="form-group">
                    <label>Select Product <span style="color:#ef4444;">*</span></label>
                    <select id="productSelect" onchange="autofillProductDetails()" style="background: #fff8f0; border-color: #fb923c; font-weight: 500;">
                        <option value="">Select Product...</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Product Name <span style="color:#ef4444;">*</span></label>
                    <input type="text" id="productInput" name="product" value="{{ customer.product }}" required>
                </div>
                <div class="form-group">
                    <label>Amount (₹) <span style="color:#ef4444;">*</span></label>
                    <input type="number" id="amountInput" name="amount" value="{{ customer.amount }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Status</label>
                    <select name="status" required>
                        <option value="Ordered" {% if customer.status == 'Ordered' %}selected{% endif %}>Ordered</option>
                        <option value="Packed" {% if customer.status == 'Packed' %}selected{% endif %}>Packed</option>
                        <option value="Shipped" {% if customer.status == 'Shipped' %}selected{% endif %}>Shipped</option>
                        <option value="Delivered" {% if customer.status == 'Delivered' %}selected{% endif %}>Delivered</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" name="address" value="{{ customer.address }}" required>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" class="btn btn-save">
                    <i class="fa fa-save"></i> Save Changes
                </button>

                <a href="/admin/customer/{{ customer.id }}/email-history" class="btn" style="background:#8b5cf6;color:#fff;" 
                   onmouseover="this.style.background='#7c3aed'" 
                   onmouseout="this.style.background='#8b5cf6'">
                    <i class="fa fa-history"></i> Email History
                </a>

                <a href="/admin/send-message/{{ customer.id }}" class="btn" style="background:#2563eb;color:#fff;" 
                   onmouseover="this.style.background='#1d4ed8'" 
                   onmouseout="this.style.background='#2563eb'">
                    <i class="fa fa-envelope"></i> Send Message
                </a>

                <a href="/admin/customers" class="btn btn-back">
                    <i class="fa fa-arrow-left"></i> Back
                </a>
            </div>
        </form>
    </div>
</div>

<script>
// Customer's current product (if any)
const currentProduct = "{{ customer.product }}";
const currentAmount = "{{ customer.amount }}";

// Load products on page load
document.addEventListener('DOMContentLoaded', function() {
    loadProductsDropdown();
});

async function loadProductsDropdown() {
    try {
        const response = await fetch('/api/products');
        const data = await response.json();
        
        const select = document.getElementById('productSelect');
        
        if (data.products && Array.isArray(data.products)) {
            data.products.forEach(product => {
                const option = document.createElement('option');
                option.value = product.id;
                option.textContent = `${product.name} - ₹${product.price}`;
                option.dataset.productName = product.name;
                option.dataset.productPrice = product.price;
                select.appendChild(option);
            });

            // Auto-select current product
            if (currentProduct) {
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].dataset.productName === currentProduct) {
                        select.selectedIndex = i;
                        break;
                    }
                }
            }
        }
    } catch (error) {
        console.error('Error loading products:', error);
    }
}

function autofillProductDetails() {
    const select = document.getElementById('productSelect');
    const productInput = document.getElementById('productInput');
    const amountInput = document.getElementById('amountInput');

    const selectedOption = select.options[select.selectedIndex];

    if (selectedOption && selectedOption.dataset.productName) {
        productInput.value = selectedOption.dataset.productName;
        amountInput.value = selectedOption.dataset.productPrice;
    }
}
</script>

</body>
</html>
