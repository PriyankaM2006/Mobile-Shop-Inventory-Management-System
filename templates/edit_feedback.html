<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Feedback</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6f8;padding:30px}
.card{max-width:720px;margin:0 auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
.form-group{margin-bottom:12px}
label{display:block;margin-bottom:6px;font-weight:600}
input[type=text],textarea,select{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:8px}
.buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer}
.btn-save{background:#2563eb;color:#fff}
.btn-cancel{background:#e5e7eb}
</style>
</head>
<body>
<div class="card">
    <h2>Edit Feedback</h2>
    <form method="post" action="/edit_feedback">
        <input type="hidden" name="id" value="{{ fb.id }}">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ fb.name }}">
        </div>
        <div class="form-group">
            <label>Order ID</label>
            <input type="text" name="order_id" value="{{ fb.order_id }}">
        </div>
        <div class="form-group">
            <label>Rating</label>
            <select name="rating">
                {% for r in range(1,6) %}
                <option value="{{ r }}" {% if fb.rating|int == r %}selected{% endif %}>{{ r }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Comment</label>
            <textarea name="comment" rows="4">{{ fb.comment }}</textarea>
        </div>

        <div class="buttons">
            <a href="/view_feedback" class="btn btn-cancel">Cancel</a>
            <button class="btn btn-save" type="submit">Save Changes</button>
        </div>
    </form>
</div>
</body>
</html>
