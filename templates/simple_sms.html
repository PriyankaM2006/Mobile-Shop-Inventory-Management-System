<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send SMS - Simple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
            max-height: 150px;
        }
        
        .char-count {
            text-align: right;
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .char-count.warning {
            color: #ff6b6b;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-send:active {
            transform: translateY(0);
        }
        
        .btn-reset {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .btn-reset:hover {
            background: #e0e0e0;
        }
        
        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #444;
        }
        
        .info-box strong {
            color: #667eea;
        }
        
        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            display: none;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            display: none;
        }
        
        .stats.show {
            display: block;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            font-weight: 600;
            color: #333;
        }
        
        .stat-value {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Send SMS</h1>
        <p class="subtitle">Simple SMS Sender</p>
        
        <div class="info-box">
            <strong>📲 From:</strong> {{ from_number }}<br>
            <strong>💡 Tip:</strong> Enter phone numbers with any format (spaces, dashes, etc.)
        </div>
        
        <div class="success-message" id="successMsg"></div>
        <div class="error-message" id="errorMsg"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Sending SMS...</p>
        </div>
        
        <form id="smsForm" onsubmit="sendSMS(event)">
            <div class="form-group">
                <label for="toPhone">📞 Send To (Phone Number)</label>
                <input 
                    type="text" 
                    id="toPhone" 
                    name="to_phone" 
                    placeholder="e.g., 9876543210 or +919876543210"
                    required
                >
                <div style="font-size: 12px; color: #999; margin-top: 5px;">
                    ✓ Works with any format: 9876543210, (762) 243-2306, +91-7806-986633
                </div>
            </div>
            
            <div class="form-group">
                <label for="message">📝 Message</label>
                <textarea 
                    id="message" 
                    name="message" 
                    placeholder="Type your message here..."
                    required
                ></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> / 160 characters
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-send">📤 Send SMS</button>
                <button type="reset" class="btn-reset">🔄 Clear</button>
            </div>
        </form>
        
        <div class="stats" id="stats">
            <div class="stat-item">
                <span class="stat-label">Last Message:</span>
                <span class="stat-value" id="lastPhone">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Sent:</span>
                <span class="stat-value" id="totalSent">0</span>
            </div>
        </div>
    </div>
    
    <script>
        // Character counter
        document.getElementById('message').addEventListener('input', function() {
            const count = this.value.length;
            const charCountEl = document.getElementById('charCount');
            charCountEl.textContent = count;
            
            // Warn if over limit
            if (count > 160) {
                charCountEl.parentElement.classList.add('warning');
            } else {
                charCountEl.parentElement.classList.remove('warning');
            }
        });
        
        // Send SMS
        async function sendSMS(event) {
            event.preventDefault();
            
            const toPhone = document.getElementById('toPhone').value.trim();
            const message = document.getElementById('message').value.trim();
            
            // Validate
            if (!toPhone) {
                showError('Please enter a phone number');
                return;
            }
            
            if (!message) {
                showError('Please enter a message');
                return;
            }
            
            if (message.length > 160) {
                showError('Message is too long (max 160 characters)');
                return;
            }
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('successMsg').classList.remove('show');
            document.getElementById('errorMsg').classList.remove('show');
            
            try {
                const response = await fetch('/api/send-simple-sms', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `to_phone=${encodeURIComponent(toPhone)}&message=${encodeURIComponent(message)}`
                });
                
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (data.success) {
                    showSuccess(`✓ SMS sent successfully to ${toPhone}!`);
                    
                    // Update stats
                    document.getElementById('lastPhone').textContent = toPhone;
                    const totalSent = parseInt(document.getElementById('totalSent').textContent) + 1;
                    document.getElementById('totalSent').textContent = totalSent;
                    document.getElementById('stats').classList.add('show');
                    
                    // Clear form
                    document.getElementById('smsForm').reset();
                    document.getElementById('charCount').textContent = '0';
                } else {
                    showError(`✗ Failed: ${data.message || 'Unknown error'}`);
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showError(`✗ Error: ${error.message}`);
            }
        }
        
        function showSuccess(message) {
            const el = document.getElementById('successMsg');
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }
        
        function showError(message) {
            const el = document.getElementById('errorMsg');
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
