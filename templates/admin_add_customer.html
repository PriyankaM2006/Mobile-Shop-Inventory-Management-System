<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin | Add Customer</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    background:#f1f5f9;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:600px;
    margin:0 auto;
}

.card{
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.card h2{
    color:#333;
    margin-bottom:25px;
    font-size:24px;
    display:flex;
    align-items:center;
    gap:10px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#333;
    font-weight:600;
    font-size:14px;
}

input, textarea, select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
}

input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

textarea{
    resize:vertical;
    min-height:80px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:0.3s;
    font-size:15px;
}

.btn-create{
    background:#22c55e;
    color:#fff;
}

.btn-create:hover{
    background:#16a34a;
}

.btn-back{
    background:#6b7280;
    color:#fff;
}

.btn-back:hover{
    background:#4b5563;
}

.info-box{
    background:#fef3c7;
    border-left:4px solid #f59e0b;
    padding:15px;
    border-radius:6px;
    margin-bottom:20px;
    font-size:14px;
    color:#92400e;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h2>
            <i class="fa fa-user-plus"></i> Add New Customer
        </h2>

        <div class="info-box">
            <i class="fa fa-info-circle"></i> Fill all fields to create a new customer order
        </div>

        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label>Customer Name *</label>
                    <input type="text" name="name" required>
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel" name="mobile" placeholder="10-digit number" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email">
                </div>

                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" name="product" placeholder="e.g., Samsung Galaxy A15" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount (₹) *</label>
                    <input type="number" name="amount" placeholder="0" required>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Delivery Address *</label>
                <textarea name="address" placeholder="House No, Street, City, Pincode" required></textarea>
            </div>

            <div class="buttons">
                <button type="submit" class="btn btn-create">
                    <i class="fa fa-plus"></i> Create Customer
                </button>
                <a href="/admin/customers" class="btn btn-back">
                    <i class="fa fa-arrow-left"></i> Back
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
