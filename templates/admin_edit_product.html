<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
            font-size: 15px;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-back {
            background: #6b7280;
            color: white;
        }

        .btn-back:hover {
            background: #4b5563;
        }

        .info-box {
            background: #ecfdf5;
            border-left: 4px solid #10b981;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #065f46;
        }

        .info-box.error {
            background: #fff1f2;
            border-left-color: #ef4444;
            color: #7f1d1d;
        }

        .product-id-box {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #0c4a6e;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .required {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin/products" class="back-link">← Back to Products</a>

        <div class="card">
            <h2>
                <i class="fas fa-edit"></i> Edit Product
            </h2>

            <div class="product-id-box">
                <strong>Product ID:</strong> {{ product.id }}
            </div>

            {% if error %}
                <div class="info-box error">
                    <i class="fas fa-exclamation-triangle"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label>Product Name <span class="required">*</span></label>
                        <input type="text" name="product_name" required value="{{ product.name }}">
                    </div>

                    <div class="form-group">
                        <label>Category <span class="required">*</span></label>
                        <select name="category" required>
                            <option value="Smartphone" {% if product.category == 'Smartphone' %}selected{% endif %}>Smartphone</option>
                            <option value="Charger" {% if product.category == 'Charger' %}selected{% endif %}>Charger</option>
                            <option value="Power Bank" {% if product.category == 'Power Bank' %}selected{% endif %}>Power Bank</option>
                            <option value="Memory Card" {% if product.category == 'Memory Card' %}selected{% endif %}>Memory Card</option>
                            <option value="Phone Case" {% if product.category == 'Phone Case' %}selected{% endif %}>Phone Case</option>
                            <option value="Smartwatch" {% if product.category == 'Smartwatch' %}selected{% endif %}>Smartwatch</option>
                            <option value="Screen Protector" {% if product.category == 'Screen Protector' %}selected{% endif %}>Screen Protector</option>
                            <option value="Wireless Earbuds" {% if product.category == 'Wireless Earbuds' %}selected{% endif %}>Wireless Earbuds</option>
                            <option value="Cable" {% if product.category == 'Cable' %}selected{% endif %}>Cable</option>
                            <option value="Other" {% if product.category == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Price (₹) <span class="required">*</span></label>
                        <input type="number" name="price" required value="{{ product.price }}" step="0.01">
                    </div>

                    <div class="form-group">
                        <label>Stock Quantity <span class="required">*</span></label>
                        <input type="number" name="stock" required value="{{ product.stock }}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>SKU (Optional)</label>
                        <input type="text" name="sku" value="{{ product.sku }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Description (Optional)</label>
                    <textarea name="description">{{ product.description }}</textarea>
                </div>

                <div class="buttons">
                    <button type="submit" class="btn btn-save">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <a href="/admin/products" class="btn btn-back">
                        <i class="fas fa-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
