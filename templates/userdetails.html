<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile Shop | Customer Details</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(rgba(15,23,42,.75), rgba(15,23,42,.75)),
        url("https://images.unsplash.com/photo-1517336714731-489689fd1ca8");
    background-size:cover;
    background-position:center;
}

.container{
    width:100%;
    max-width:540px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(14px);
    padding:35px;
    border-radius:20px;
    color:#fff;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

.card h2{
    text-align:center;
    margin-bottom:25px;
}

/* Product Selector */
.product-selector {
    background: rgba(255, 255, 255, 0.08);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.product-selector h3 {
    color: #fff;
    font-size: 14px;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 12px;
}

.product-item {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
    border: 2px solid rgba(139, 92, 246, 0.3);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    color: #fff;
}

.product-item:hover {
    border-color: rgba(139, 92, 246, 0.8);
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
    transform: translateY(-3px);
    box-shadow: 0 6px 12px rgba(139, 92, 246, 0.3);
}

.product-item i {
    display: block;
    font-size: 24px;
    margin-bottom: 8px;
    color: #8b5ce6;
}

.product-item strong {
    display: block;
    font-size: 12px;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.product-item span {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #22c55e;
}

/* Selected Product Display */
.selected-product {
    background: rgba(34, 197, 94, 0.15);
    border: 2px solid rgba(34, 197, 94, 0.5);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 25px;
    animation: slideDown 0.3s ease;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.product-info {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #86efac;
}

.product-info i {
    font-size: 20px;
    color: #22c55e;
}

#selectedName {
    display: block;
    color: #fff;
    font-size: 15px;
}

#selectedPrice {
    display: block;
    color: #86efac;
    font-size: 14px;
    margin-top: 4px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    outline:none;
}

textarea{
    resize:none;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.btn-confirm{
    background:#22c55e;
    color:#fff;
}

.btn-back{
    background:#e5e7eb;
    color:#111827;
}

.note{
    text-align:center;
    font-size:13px;
    margin-top:14px;
    color:#e5e7eb;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h2>Customer Details</h2>
<!-- 
        Product Selector
        <div class="product-selector">
            <h3><i class="fas fa-star" style="color: #ff6b6b;"></i> Select Product (Required)</h3>
            <p style="font-size: 12px; color: #d1d5db; margin-bottom: 15px;">Choose a product to continue with your order</p>
            <div class="product-grid">
                <div class="product-item" onclick="selectProduct('iPhone 14 Pro', 129999)">
                    <i class="fas fa-mobile-alt"></i>
                    <strong>iPhone 14 Pro</strong>
                    <span>₹129,999</span>
                </div>
                <div class="product-item" onclick="selectProduct('Galaxy S24', 99999)">
                    <i class="fas fa-mobile-alt"></i>
                    <strong>Galaxy S24</strong>
                    <span>₹99,999</span>
                </div>
                <div class="product-item" onclick="selectProduct('USB-C Charger 65W', 2999)">
                    <i class="fas fa-bolt"></i>
                    <strong>USB-C Charger</strong>
                    <span>₹2,999</span>
                </div>
                <div class="product-item" onclick="selectProduct('Power Bank 20000mAh', 1999)">
                    <i class="fas fa-battery-three-quarters"></i>
                    <strong>Power Bank 20K</strong>
                    <span>₹1,999</span>
                </div>
                <div class="product-item" onclick="selectProduct('MicroSD Card 256GB', 3500)">
                    <i class="fas fa-sd-card"></i>
                    <strong>MicroSD 256GB</strong>
                    <span>₹3,500</span>
                </div>
                <div class="product-item" onclick="selectProduct('Premium Phone Case', 599)">
                    <i class="fas fa-shield-alt"></i>
                    <strong>Phone Case</strong>
                    <span>₹599</span>
                </div>
                <div class="product-item" onclick="selectProduct('Smartwatch Pro', 12999)">
                    <i class="fas fa-watch"></i>
                    <strong>Smartwatch Pro</strong>
                    <span>₹12,999</span>
                </div>
                <div class="product-item" onclick="selectProduct('AirPods Pro', 29999)">
                    <i class="fas fa-headphones"></i>
                    <strong>AirPods Pro</strong>
                    <span>₹29,999</span>
                </div>
            </div>
        </div>

        <div class="selected-product" id="selectedProduct" style="display:none;">
            <div class="product-info">
                <i class="fas fa-check-circle"></i>
                <div>
                    <strong id="selectedName"></strong>
                    <span id="selectedPrice"></span>
                </div>
            </div>
        </div> -->

        <form method="post" action="/customer_details">

            <!-- Hidden fields populated when user clicked Buy Now or selected product -->
            <input type="hidden" name="product_name" id="productNameField" value="{{ product_name or '' }}">
            <input type="hidden" name="amount" id="amountField" value="{{ amount or '' }}">
            <input type="hidden" name="product_image" value="{{ image or '' }}">

            <!-- PRODUCT AMOUNT SUMMARY SECTION -->
            {% if product_name and amount %}
            <div class="product-details" style="background: rgba(59, 130, 246, 0.15); border: 2px solid rgba(59, 130, 246, 0.4); padding: 20px; border-radius: 12px; margin-bottom: 25px;">
                <h3 style="color: #60a5fa; font-size: 14px; text-transform: uppercase; margin: 0 0 15px 0; padding-bottom: 10px; border-bottom: 1px solid rgba(59, 130, 246, 0.3);">
                    <i class="fas fa-shopping-cart"></i> Selected Product
                </h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
                    <label style="color: rgba(255, 255, 255, 0.7);">Product Name:</label>
                    <span style="color: #fff; font-weight: 500;">{{ product_name }}</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
                    <label style="color: rgba(255, 255, 255, 0.7);">Base Price:</label>
                    <span style="color: #fff; font-weight: 500;">₹ {{ "{:.2f}".format(amount|float) }}</span>
                </div>
            </div>

            <!-- AMOUNT SECTION -->
            <div class="amount-calculation" style="background: rgba(34, 197, 94, 0.15); border: 2px solid rgba(34, 197, 94, 0.4); padding: 20px; border-radius: 12px; margin-bottom: 25px;">
                <h3 style="color: #86efac; font-size: 14px; text-transform: uppercase; margin: 0 0 15px 0; padding-bottom: 10px; border-bottom: 1px solid rgba(34, 197, 94, 0.3);">
                    <i class="fas fa-credit-card"></i> Total Amount
                </h3>
                <div style="display: flex; justify-content: space-between; border-top: 1px solid rgba(34, 197, 94, 0.3); padding-top: 12px; margin-bottom: 0; font-size: 16px;">
                    <label style="color: #86efac; font-weight: 600;">Total Amount:</label>
                    <span style="color: #22c55e; font-weight: bold; font-size: 18px;">₹ <span id="totalAmount">{{ "{:.2f}".format(amount|float) }}</span></span>
                </div>
            </div>
            {% endif %}

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="customer_name" placeholder="eg. Kavi Kumar" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" name="mobile" placeholder="eg. 9876543210" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="eg. kavi@gmail.com">
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <textarea name="address" rows="3" placeholder="House No, Street, City, Pincode" required></textarea>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <input type="text" value="Cash on Delivery" readonly>
            </div>

            <div class="buttons">
                <button type="button" class="btn btn-back" onclick="history.back()">
                    <i class="fa fa-arrow-left"></i> Back
                </button>

                <button type="submit" class="btn btn-confirm" onclick="return validateForm()">
                    <i class="fa fa-credit-card"></i> Continue to Payment
                </button>
            </div>

            <p class="note">
                You will be redirected to payment options after submitting your details
            </p>

        </form>
    </div>
</div>

<script>
// Form validation
document.querySelector('form').addEventListener('submit', function(e) {
    const name = document.querySelector('input[name="customer_name"]').value.trim();
    const mobile = document.querySelector('input[name="mobile"]').value.trim();
    const email = document.querySelector('input[name="email"]').value.trim();
    const address = document.querySelector('textarea[name="address"]').value.trim();
    
    if (!name || !mobile || !address) {
        alert('Please fill in all required fields (Name, Mobile, Address)');
        e.preventDefault();
        return false;
    }
    
    // Basic mobile number validation (10 digits)
    if (!/^\d{10}$/.test(mobile)) {
        alert('Please enter a valid 10-digit mobile number');
        e.preventDefault();
        return false;
    }
    
    // Basic email validation if provided
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert('Please enter a valid email address');
        e.preventDefault();
        return false;
    }
    
    return true;
});

// Auto-fill demo data for testing (optional)
function fillDemoData() {
    document.querySelector('input[name="customer_name"]').value = 'John Doe';
    document.querySelector('input[name="mobile"]').value = '9876543210';
    document.querySelector('input[name="email"]').value = 'john@example.com';
    document.querySelector('textarea[name="address"]').value = '123 Main Street, City, State - 123456';
}

// Add a demo data button for testing
document.addEventListener('DOMContentLoaded', function() {
    const buttonsDiv = document.querySelector('.buttons');
    const demoButton = document.createElement('button');
    demoButton.type = 'button';
    demoButton.className = 'btn';
    demoButton.style.background = '#f59e0b';
    demoButton.style.color = '#fff';
    demoButton.innerHTML = '<i class="fa fa-magic"></i> Fill Demo Data';
    demoButton.onclick = fillDemoData;
    
    buttonsDiv.insertBefore(demoButton, buttonsDiv.firstChild);
});

// Auto-select product if redirected with product/amount query params
document.addEventListener('DOMContentLoaded', function() {
    try {
        const pnField = document.getElementById('productNameField');
        const amtField = document.getElementById('amountField');
        if (pnField && pnField.value && pnField.value.trim() !== '') {
            const pn = pnField.value.trim();
            const amt = parseInt(amtField.value) || 0;
            // Show selected product UI
            const selectedDiv = document.getElementById('selectedProduct');
            if (selectedDiv) {
                document.getElementById('selectedName').textContent = pn;
                document.getElementById('selectedPrice').textContent = '₹' + (amt).toLocaleString('en-IN');
                selectedDiv.style.display = 'block';
            }
            console.log('Auto-filled product:', pn, amt);
        }
    } catch (e) {
        console.log('Auto-fill error', e);
    }
});

function selectProduct(productName, price) {
    // Update hidden form fields
    document.getElementById('productNameField').value = productName;
    document.getElementById('amountField').value = price;
    
    // Update amount calculations on the page
    updateAmountCalculations(price);
    
    // Show selected product display
    const selectedDiv = document.getElementById('selectedProduct');
    document.getElementById('selectedName').textContent = productName;
    document.getElementById('selectedPrice').textContent = '₹' + price.toLocaleString('en-IN');
    selectedDiv.style.display = 'block';
    
    // Scroll to form
    document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    
    console.log('Selected product:', productName, 'Price:', price);
}

function updateAmountCalculations(amount) {
    // Update the displayed values
    const totalAmtEl = document.getElementById('totalAmount');
    
    if (totalAmtEl) totalAmtEl.textContent = parseFloat(amount).toFixed(2);
}

function validateForm() {
    const productName = document.getElementById('productNameField').value.trim();
    const amount = document.getElementById('amountField').value.trim();
    
    if (!productName || productName === '') {
        alert('Please select a product before continuing!');
        document.querySelector('.product-selector').scrollIntoView({ behavior: 'smooth' });
        return false;
    }
    
    if (!amount || amount === '0' || amount === '') {
        alert('Invalid product or price. Please select a product again.');
        return false;
    }
    
    return true;
}
</script>

</body>
</html>
