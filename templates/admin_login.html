<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Mobile Shop</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body{
    margin: 0;
    height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
        url("https://images.unsplash.com/photo-1517336714731-489689fd1ca8") no-repeat center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.login-container {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
}

/* Login Type Selection */
.login-type-select {
    text-align: center;
    position: absolute;
    top: 20px;
    right: 20px;
}

.login-type-select a {
    display: inline-block;
    padding: 10px 20px;
    margin: 0 5px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
    color: #fff;
    border: 2px solid #fff;
}

.login-type-select a.active {
    background: #e74c3c;
    border-color: #e74c3c;
}

.login-type-select a:not(.active) {
    background: transparent;
    color: #ddd;
}

.login-type-select a:hover:not(.active) {
    border-color: #3498db;
    color: #3498db;
}

/* Admin Badge */
.admin-badge {
    text-align: center;
    margin-bottom: 30px;
}

.admin-badge i {
    font-size: 56px;
    color: #e74c3c;
    margin-bottom: 15px;
}

.admin-badge h3 {
    color: #fff;
    font-size: 28px;
    margin: 0;
}

.admin-badge p {
    color: #ddd;
    font-size: 14px;
    margin: 5px 0 0 0;
}

/* Login Card */
.login-box{
    width: 380px;
    padding: 40px;
    border-radius: 15px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
}

.login-box h2{
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.login-box h2 i {
    color: #e74c3c;
}

/* Input Group */
.input-group{
    margin-bottom: 20px;
    position: relative;
}

.input-group i{
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    color: #ddd;
}

.input-group input{
    width: 100%;
    padding: 13px 13px 13px 45px;
    border: none;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.95);
    transition: 0.3s;
}

.input-group input:focus{
    background: #fff;
    box-shadow: 0 0 0 3px rgba(231,76,60,0.3);
}

/* Error Message */
.error-message {
    background: #e74c3c;
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.error-message i {
    font-size: 16px;
}

/* Button */
.login-box button{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.login-box button:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(231,76,60,0.4);
}

.login-box button i {
    margin-right: 8px;
}

/* Footer text */
.login-box p{
    text-align: center;
    font-size: 12px;
    margin-top: 20px;
    color: #ddd;
}

.login-box a {
    color: #3498db;
    text-decoration: none;
}

.login-box a:hover {
    text-decoration: underline;
}

.business-footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    color: #ddd;
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,0.2);
}

.business-footer strong {
    color: #3498db;
}

/* Security Features */
.security-info {
    background: rgba(52,152,219,0.2);
    border: 1px solid rgba(52,152,219,0.5);
    padding: 12px;
    border-radius: 8px;
    font-size: 12px;
    color: #ddd;
    margin-bottom: 20px;
}

.security-info i {
    color: #3498db;
    margin-right: 6px;
}

@media (max-width: 600px) {
    .login-container {
        flex-direction: column;
        gap: 20px;
    }

    .login-box {
        width: 90%;
        max-width: 350px;
    }

    .admin-badge {
        display: none;
    }

    .login-type-select {
        position: static;
        margin-bottom: 20px;
    }
}
</style>
</head>

<body>



<div class="login-container">
    <div class="admin-badge">
        <i class="fa fa-lock"></i>
        <h3>Admin Control Panel</h3>
        <p>Manage customers and orders</p>
    </div>

    <div class="login-box">
        <h2>
            <i class="fa fa-shield-alt"></i> Admin Portal
        </h2>

        {% if error %}
        <div class="error-message">
            <i class="fa fa-exclamation-circle"></i>
            {{ error }}
        </div>
        {% endif %}

        <div class="security-info">
            <i class="fa fa-info-circle"></i>
            Admin access only. Unauthorized access is prohibited.
        </div>

        <form method="POST">
            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" name="username" placeholder="Admin Username" required autofocus>
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" placeholder="Admin Password" required>
            </div>

            <button type="submit">
                <i class="fa fa-sign-in-alt"></i> Login as Admin
            </button>


        </form>

        {% if business %}
        <div class="business-footer">
            <strong>{{ business.name }}</strong><br>
            📞 {{ business.phone }} | 📧 {{ business.email }}
        </div>
        {% endif %}
    </div>
</div>

</body>
</html>
