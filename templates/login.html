<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Login</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body{
    margin: 0;
    height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url("https://images.unsplash.com/photo-1511707171634-5f897ff02aa9") no-repeat center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Login Card */
.login-box{
    width: 400px;
    padding: 35px;
    border-radius: 15px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    color: #fff;
}

/* Tabs */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.tab-btn {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 3px solid transparent;
    transition: 0.3s;
}

.tab-btn.active {
    color: #fff;
    border-bottom-color: #00c6ff;
}

.tab-btn:hover {
    color: #fff;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.login-box h2{
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
}

/* Input Group */
.input-group{
    margin-bottom: 18px;
    position: relative;
}

.input-group i{
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    color: #ddd;
}

.input-group input{
    width: 100%;
    padding: 12px 12px 12px 40px;
    border: none;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

.input-group input:focus{
    box-shadow: 0 0 0 2px #00c6ff;
}

/* Button */
.login-box button{
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.login-box button:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,198,255,0.5);
}

/* Footer text */
.login-box p{
    text-align: center;
    font-size: 13px;
    margin-top: 18px;
    color: #ddd;
}

.business-footer {
    text-align: center;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 12px;
    color: #ccc;
}

.business-footer i {
    color: #00ff00;
    margin-right: 5px;
}

.business-footer small {
    display: block;
    margin-top: 5px;
    color: rgba(255,255,255,0.7);
}

/* Admin Link */
.admin-link {
    text-align: center;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.2);
}

.admin-link a {
    color: #e74c3c;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.3s;
}

.admin-link a:hover {
    color: #fff;
}

/* Error Message */
.error-message {
    background: rgba(231,76,60,0.3);
    color: #ff6b6b;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 12px;
    border: 1px solid #e74c3c;
}

</style>
</head>

<body>

<div class="login-box">
    <h2 style="text-align: center; margin-bottom: 20px;">Mobile Shop Login</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('user')">👤 User</button>
        <button class="tab-btn" onclick="switchTab('admin')">🔐 Admin</button>
    </div>

    <!-- User Login Tab -->
    <div id="user" class="tab-content active">
        {% if error and 'admin' not in request.form %}
        <div class="error-message">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/">
            <input type="hidden" name="login_type" value="user">
            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">Login as User</button>
        </form>
    </div>

    <!-- Admin Login Tab -->
    <div id="admin" class="tab-content">
        {% if error and 'admin' in request.form %}
        <div class="error-message">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <input type="hidden" name="login_type" value="admin">
            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" name="username" placeholder="Admin Username" required>
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" placeholder="Admin Password" required>
            </div>

            <button type="submit">Login as Admin</button>
        </form>
    </div>

    <p style="text-align: center; font-size: 13px; margin-top: 18px; color: #ddd;">Mobile Shop Inventory System</p>

    <div class="business-footer">
        <i class="fa fa-store"></i> {{ business.name }}<br>
        <small>GST: {{ business.gst_number }} | {{ business.tagline }}</small>
    </div>
</div>

<script>
function switchTab(tab) {
    // Hide all tabs
    document.getElementById('user').classList.remove('active');
    document.getElementById('admin').classList.remove('active');
    
    // Remove active class from all buttons
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    // Show selected tab and activate button
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
}
</script>

</body>
</html>
